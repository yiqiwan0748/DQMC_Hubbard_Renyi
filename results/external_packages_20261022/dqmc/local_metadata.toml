[settings]
periodic = [false, false]
U_values = [0.0, 2.0]
sweeps_per_measurement = 1
checkerboard = false
measurements = 20000
energy_normalization = "per site"
symmetric = false
burnin = 1000
bins = 40
mu = 0.0
beta = 2.0
root_seeds = [17011, 27011, 37013, 47017]
Ly = 2
n_stab = 10
hamiltonian = "sum(K_ij cdag_i c_j) + U sum((nup-1/2)(ndn-1/2)) - mu N"
Lx = 2
ensemble = "grand canonical"
sites = 4
t = 1.0
propagator = "exp(-dtau V) exp(-dtau K)"
dtau = 0.05

